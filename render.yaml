# Render Blueprint: one Node web service that serves the game and runs the
# real-time private rooms (WebSockets). A static site cannot do the latter.
services:
  - type: web
    name: crown-poker-online
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
